<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>نهج وان ERP | NahjOne ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    #app-frame { width: 100%; height: 100%; border: 0; display: block; background: #f8fafc; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0f172a; color: #f8fafc;
      z-index: 10; transition: opacity 0.3s ease;
    }
    .spinner {
      width: 42px; height: 42px; border: 3px solid rgba(14, 165, 233, 0.25);
      border-top-color: #0ea5e9; border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-size: 16px; font-weight: 700;">NahjOne ERP — نهج وان</div>
    <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;">جاري الاتصال بالسحابة المباشرة...</div>
  </div>
  <iframe id="app-frame" allow="clipboard-read; clipboard-write; fullscreen; camera; microphone"></iframe>
  <script>
    (async function() {
      try {
        const res = await fetch('./tunnel.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        const target = (data && data.url) ? data.url : 'https://lexington-six-diving-occurrence.trycloudflare.com';
        const frame = document.getElementById('app-frame');
        frame.src = target + window.location.hash;
        frame.onload = function() {
          const loader = document.getElementById('loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 300);
          }
        };
      } catch (e) {
        document.getElementById('app-frame').src = 'https://lexington-six-diving-occurrence.trycloudflare.com';
      }
    })();
  </script>
</body>
</html>
